[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piecewise"
version = "0.1.0"
description = "Systematic jigsaw puzzle difficulty and time estimation tool"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10",
    "scikit-image>=0.22",
    "PyYAML>=6",
]

[project.scripts]
piecewise = "piecewise.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
ui = ["streamlit>=1.28", "plotly>=5.18"]

[tool.setuptools.packages.find]
include = ["piecewise*"]
