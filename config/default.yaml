weights:
  pieces: 0.10
  color_richness: 0.24
  color_clustering: 0.21
  texture: 0.13
  pattern_repetition: 0.12
  sharpness: 0.07
  cut_shape: 0.06
  backside: 0.04
  blind: 0.03

# difficulty_factor for each cut shape type
cut_shape_factors:
  ribbon: 1.25
  random: 0.85
  irregular: 0.60

# difficulty_factor for backside hint types
backside_factors:
  none: 1.0
  alphabet: 0.70
  pattern: 0.45

# blind puzzle penalty
blind_penalty: 1.60

# piece count model: difficulty = (n / reference_pieces) ^ exponent
piece_model:
  reference_pieces: 500
  exponent: 0.35

# time estimation: estimated = ref_hours_for_500 * piece_scale(n) * score ^ 1.5
time_base:
  ref_hours_for_500: 4.0

# piece-count time scaling calibrated to reference benchmarks (score=1.0)
#   500pcs: 3-5h    1000pcs: 6-10h   1500pcs: 10-18h
#   2000pcs: 15-25h  3000pcs: 25-50h
time_piece_scaling:
  100: 0.3
  300: 0.6
  500: 1.0
  750: 1.8
  1000: 2.0
  1500: 3.5
  2000: 5.0
  3000: 9.375
  4000: 15.0
  5000: 25.0

# color richness bins
color_richness_bins:
  minimal: [0, 6]
  low: [6, 15]
  moderate: [15, 30]
  high: [30, 180]

# pattern repetition bins
pattern_repetition_bins:
  unique: [0, 0.05]
  slightly_repetitive: [0.05, 0.15]
  moderately_repetitive: [0.15, 0.30]
  highly_repetitive: [0.30, 1.0]

# sharpness bins
sharpness_bins:
  very_blurry: [0, 20]
  blurry: [20, 60]
  normal: [60, 150]
  sharp: [150, 400]
  very_sharp: [400, 999999]
